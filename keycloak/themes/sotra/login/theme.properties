# Tema de login de SOTRA: el mismo diseño que tenía la pantalla de login del frontend
# (logo CVM, formulario a la izquierda y foto de maquinaria a la derecha). Hereda las plantillas
# de "base" y solo reemplaza la estructura general (template.ftl), los estilos y algunos textos.
parent=base
import=common/keycloak

styles=css/sotra.css
meta=viewport==width=device-width,initial-scale=1
locales=es

kcFormGroupClass=sotra-grupo
kcLabelClass=sotra-etiqueta
kcInputClass=sotra-campo
kcInputGroup=sotra-campo-con-boton
kcInputErrorMessageClass=sotra-error-campo
kcInputHelperTextBeforeClass=sotra-ayuda
kcInputHelperTextAfterClass=sotra-ayuda

kcFormOptionsWrapperClass=sotra-opciones
kcFormSettingClass=sotra-opciones-fila

kcButtonClass=sotra-boton
kcButtonPrimaryClass=sotra-boton-primario
kcButtonDefaultClass=sotra-boton-secundario
kcButtonBlockClass=sotra-boton-bloque
kcButtonLargeClass=

kcFormPasswordVisibilityButtonClass=sotra-ver-contrasena
kcFormPasswordVisibilityIconShow=sotra-icono-ver
kcFormPasswordVisibilityIconHide=sotra-icono-ocultar

kcAlertClass=sotra-aviso
kcAlertTitleClass=sotra-aviso-texto
