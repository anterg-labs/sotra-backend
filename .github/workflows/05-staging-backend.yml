name: Publicar y desplegar backend QA

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    if: github.ref == 'refs/heads/qa'
    name: Construir, publicar y analizar backend QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Descargar codigo QA
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar backend
        run: dotnet build --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test --no-build --configuration Release

      - name: Obtener version unica de QA
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=qa-1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Normalizar imagen
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=qa
          labels: |
            org.opencontainers.image.title=SOTRA Backend QA
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Construir y publicar QA
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # Analiza la imagen publicada por digest, sin volver a construirla.
      # Un resultado fallido impide ejecutar el job deploy.
      - name: Analizar imagen Docker con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: publish
    if: vars.ENABLE_STAGING_DEPLOY == 'true'
    name: Actualizar backend y estructura QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Descargar codigo QA para archivos SQL
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validar archivos SQL requeridos
        shell: bash
        run: |
          test -s database/init/01-init.sql
          test -s database/init/02-vectorial.sql
          test -s database/init/cargar-datos.sh

      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copiar SQL QA al VPS (solo staging)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/apps/sotra-staging/database/init /opt/apps/sotra-staging/database/cambios'
          scp -i ~/.ssh/id_ed25519 \
            database/init/01-init.sql \
            database/init/02-vectorial.sql \
            database/init/cargar-datos.sh \
            "$VPS_USER@$VPS_HOST:/opt/apps/sotra-staging/database/init/"
          scp -i ~/.ssh/id_ed25519 \
            database/cambios/*.sql \
            "$VPS_USER@$VPS_HOST:/opt/apps/sotra-staging/database/cambios/"

      - name: Cargar SQL y desplegar backend staging
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            'cd /opt/apps/sotra-staging && docker compose --env-file .env.staging -f compose.staging.yml up -d database && docker compose --env-file .env.staging -f compose.staging.yml run --rm db-datos && docker compose --env-file .env.staging -f compose.staging.yml pull backend && docker compose --env-file .env.staging -f compose.staging.yml up -d --no-deps backend'

      - name: Smoke test backend (si se configura URL)
        if: vars.BACKEND_HEALTH_URL != ''
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$BACKEND_HEALTH_URL"
