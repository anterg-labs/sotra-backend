# Servicios de IA en contenedores (Ollama, embeddings y reranker). Es opcional: sin este archivo la API usa
# OLLAMA_BASE_URL y RERANKER_CARPETA del .env, igual que en compose.yml.
# Uso: docker compose -f compose.yml -f compose.ia.yml up -d   (o junto con compose.dev.yml)
services:
  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - modelos_reranker:/modelos:ro
    depends_on:
      ollama:
        condition: service_healthy
      modelo-embeddings:
        condition: service_completed_successfully
      reranker-modelo:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.6.2
    container_name: sotra-ollama
    ports:
      - "11434:11434"
    volumes:
      - modelos_ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  modelo-embeddings:
    image: ollama/ollama:0.6.2
    container_name: sotra-modelo-embeddings
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show bge-m3 >/dev/null 2>&1 || ollama pull bge-m3"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  reranker-modelo:
    image: curlimages/curl:8.21.0
    container_name: sotra-reranker-modelo
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /modelos
        [ -s model_quantized.onnx ] || curl -fL --retry 3 -o model_quantized.onnx https://huggingface.co/woxpas-ai/bge-reranker-v2-m3-onnx/resolve/main/onnx/model_quantized.onnx
        [ -s tokenizer.json ] || curl -fL --retry 3 -o tokenizer.json https://huggingface.co/BAAI/bge-reranker-v2-m3/resolve/main/tokenizer.json
    volumes:
      - modelos_reranker:/modelos
    restart: "no"

volumes:
  modelos_ollama:
    name: sotra_modelos_ollama
  # Reranker ONNX y su tokenizador (~560 MB): los descarga el servicio reranker-modelo la primera vez.
  modelos_reranker:
    name: sotra_modelos_reranker
