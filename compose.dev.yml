services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: sotra-backend:dev-local
    container_name: sotra-backend-dev
    env_file:
      - .env
    ports:
      - "8081:8080"
    restart: unless-stopped
    extra_hosts:
      - "localhost:172.28.0.1"
    volumes:
      - .:/src
      - ../sotra-asistencia-documental/modelos:/modelos:ro
      - paquetes_nuget:/root/.nuget/packages
      - /src/Api/bin
      - /src/Api/obj
      - /src/SOTRA-BACKEND/bin
      - /src/SOTRA-BACKEND/obj

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: sotra-keycloak-dev
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KC_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KC_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  paquetes_nuget:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
