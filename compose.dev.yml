services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: sotra-backend:dev-local
    container_name: sotra-backend-dev
    env_file:
      - .env
    ports:
      - "8081:8080"
    restart: unless-stopped
    extra_hosts:
      - "localhost:172.28.0.1"
    volumes:
      - .:/src
      - ../sotra-asistencia-documental/modelos:/modelos:ro
      - paquetes_nuget:/root/.nuget/packages
      - /src/Api/bin
      - /src/Api/obj
      - /src/SOTRA-BACKEND/bin
      - /src/SOTRA-BACKEND/obj

volumes:
  paquetes_nuget:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
