services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: sotra-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: --locale=C.utf8 --locale-provider=icu --icu-locale=es-UY
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-datos:
    image: pgvector/pgvector:pg18
    container_name: sotra-db-datos
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./database/init:/datos:ro
      - ./database/cambios:/cambios:ro
    entrypoint: ["sh", "/datos/cargar-datos.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sotra-backend
    container_name: sotra-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      RERANKER_MODELO_RUTA: /modelos/model_quantized.onnx
      RERANKER_TOKENIZADOR_RUTA: /modelos/tokenizer.json
      EMBEDDINGS_MODELO_RUTA: /modelos/embeddings/model_quantized.onnx
      EMBEDDINGS_TOKENIZADOR_RUTA: /modelos/embeddings/tokenizer.json
      IA_API_URL: ${IA_API_URL:-}
      IA_API_MODELO: ${IA_API_MODELO:-}
      IA_API_CLAVE: ${IA_API_CLAVE:-}
      IA_API_ESFUERZO: ${IA_API_ESFUERZO-low}
      IA_API_LLAMADAS_POR_MINUTO: ${IA_API_LLAMADAS_POR_MINUTO:-10}
      KEYCLOAK_EMISOR: http://localhost:${KC_PORT}/realms/sotra
      KEYCLOAK_METADATA: http://keycloak:8080/realms/sotra/.well-known/openid-configuration
      KEYCLOAK_AUDIENCIA: sotra-api
      AUTH_OBLIGATORIA: ${AUTH_OBLIGATORIA:-true}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: sotra
      KEYCLOAK_ADMIN_CLIENTE: sotra-backend-admin
      KEYCLOAK_ADMIN_SECRETO: ${KEYCLOAK_ADMIN_SECRETO}
      KEYCLOAK_CLIENTE_FRONTEND: sotra-frontend
    ports:
      - "${API_PORT}:8080"
    volumes:
      - modelos_ia:/modelos:ro
    restart: unless-stopped
    depends_on:
      db-datos:
        condition: service_completed_successfully
      modelos-ia:
        condition: service_completed_successfully

  # Descarga a un volumen los modelos de IA que corren dentro de la API (reranker y embeddings bge-m3, ONNX
  # cuantizados). Solo baja lo que falta: la primera vez son unos 1,1 GB; después termina al instante.
  # El resumen de las sugerencias no necesita modelos locales: lo redacta el proveedor de IA_API_*.
  modelos-ia:
    image: curlimages/curl:8.21.0
    container_name: sotra-modelos-ia
    user: root
    entrypoint: ["/bin/sh", "-c"]
    # Revisiones fijas: los vectores guardados dependen del modelo exacto de embeddings.
    command:
      - |
        set -e
        reranker=https://huggingface.co/woxpas-ai/bge-reranker-v2-m3-onnx/resolve/c44ebc43de724ae8816668bb44d2e728e17faa18
        tokenizador_reranker=https://huggingface.co/BAAI/bge-reranker-v2-m3/resolve/953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
        embeddings=https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858
        bajar() { [ -s "$$2" ] || { curl -fsSL --retry 3 -o "$$2.parcial" "$$1" && mv "$$2.parcial" "$$2"; }; }
        mkdir -p /modelos/embeddings
        bajar "$$reranker/onnx/model_quantized.onnx" /modelos/model_quantized.onnx
        bajar "$$tokenizador_reranker/tokenizer.json" /modelos/tokenizer.json
        bajar "$$embeddings/onnx/model_quantized.onnx" /modelos/embeddings/model_quantized.onnx
        bajar "$$embeddings/tokenizer.json" /modelos/embeddings/tokenizer.json
        echo "Modelos de IA listos"
    volumes:
      - modelos_ia:/modelos
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: sotra-keycloak
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Tema del login con el diseño del frontend (realm sotra, «loginTheme»: «sotra»).
      - ./keycloak/themes/sotra:/opt/keycloak/themes/sotra:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KC_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_SMTP_HOST: ${KC_SMTP_HOST}
      KC_SMTP_PORT: ${KC_SMTP_PORT}
      KC_SMTP_FROM: ${KC_SMTP_FROM}
      KC_SMTP_USER: ${KC_SMTP_USER}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD}
    ports:
      - "${KC_PORT}:8080"
    restart: unless-stopped
    depends_on:
      # db-datos crea el usuario y el esquema keycloak antes de que arranque.
      db-datos:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  # Conserva el nombre del volumen que usaba compose.ia.yml para no volver a descargar el reranker.
  modelos_ia:
    name: sotra_modelos_reranker
