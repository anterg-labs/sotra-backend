services:
  db:
    image: postgres:18
    container_name: sotra-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sotra-backend:dev
    container_name: sotra-backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__SotraConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: "http://+:8080"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      - db

volumes:
  postgres_data:
